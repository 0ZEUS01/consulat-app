name: Consulat-App CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write 
jobs:
  # JOB 1: Backend Unit Tests & Build
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: mvn test -Dtest=DemandeServiceTest

      - name: Package Backend JAR
        working-directory: ./backend
        run: mvn package -DskipTests

  # JOB 2: Frontend Build Check
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & Build Angular
        working-directory: ./frontend
        run: |
          npm install
          npm run build

  # JOB 3: Build & Push Docker Images (Only runs if Jobs 1 & 2 pass!)
  docker-push:
    needs: [ backend-ci, frontend-ci ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner for Docker tags
        run: echo "OWNER_LOWER=$(echo '${{ github.repository_owner }}' \vert{} tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ env.OWNER_LOWER }}/consulat-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ env.OWNER_LOWER }}/consulat-frontend:latest