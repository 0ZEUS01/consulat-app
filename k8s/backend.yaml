apiVersion: apps/v1
kind: Deployment
metadata:
  name: consulat-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: consulat-backend
  template:
    metadata:
      labels:
        app: consulat-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/0zeus01/consulat-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: consulat_db
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              value: password
---
apiVersion: v1
kind: Service
metadata:
  name: consulat-backend
spec:
  selector:
    app: consulat-backend
  ports:
    - port: 8080
      targetPort: 8080
  type: LoadBalancer