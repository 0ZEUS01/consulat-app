services:
  db:
    image: postgres:16-alpine
    container_name: consulat-db
    environment:
      POSTGRES_DB: consulat_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - consulat-net

  backend:
    build: ./backend
    container_name: consulat-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db          
      DB_PORT: 5432      
      DB_NAME: consulat_db
      DB_USER: postgres
      DB_PASSWORD: password
    depends_on:
      - db
    networks:
      - consulat-net

  frontend:
    build: ./frontend
    container_name: consulat-frontend
    ports:
      - "4200:80"        
    depends_on:
      - backend
    networks:
      - consulat-net

volumes:
  postgres_data:

networks:
  consulat-net: